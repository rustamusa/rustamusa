/* ---------- tokens ----------
   three surfaces: the plum page, the pink cards that lie on it, and the tomato bands. Amber draws the lines and lights the dots.
   every surface carries the same fine grain. The whole look is this block. */
:root{
  /* the page */
  --page:#2B1437; --page-hi:#3B1E4A; --page-lo:#1E0C28;
  --on:#F7EBF5; --on-2:#CBAFD1; --rule:rgba(247,235,245,.18); --rule-2:rgba(247,235,245,.46);
  --accent:#FFB23E; --glow:#FFB23E; --well:rgba(18,5,24,.45); --hero-glow:rgba(255,80,130,.22);
  --btn:#F7EBF5; --btn-hi:#FFFFFF; --btn-on:#2B1437;
  --b1:#F7EBF5; --b2:#FFB23E; --b3:#FF5B3A; --b4:#6B4A72; --b1-on:#2B1437; --b2-on:#2B1437; --b3-on:#2B1437;
  /* cards */
  --card:#FFD3E2; --card-on:#2B1437; --card-on-2:#6B4470; --card-accent:#A8125F; --card-glow:#A8125F;
  --card-rule:rgba(43,20,55,.16); --card-rule-2:rgba(43,20,55,.42); --card-btn:#2B1437; --card-btn-hi:#3B1E4A; --card-btn-on:#FFD3E2; --field:rgba(255,255,255,.5);
  --cb1:#2B1437; --cb2:#A8125F; --cb3:#FF5B3A; --cb4:#D9A3BC; --cb1-on:#FFD3E2; --cb2-on:#FFD3E2; --cb3-on:#2B1437;
  /* bands */
  --band:#FF5B3A; --band-on:#2B1437; --band-on-2:#4A1510; --band-accent:#2B1437; --band-dim:#FFFFFF; --band-rule:rgba(43,20,55,.22); --band-rule-2:rgba(43,20,55,.55);
  --band-well:rgba(255,255,255,.18); --band-glow:rgba(255,190,90,.5); --band-btn:#2B1437; --band-btn-hi:#3B1E4A; --band-btn-on:#FFE0D6;
  /* the footer */
  --foot:#1E0C28; --foot-on:#F7EBF5; --foot-on-2:#CBAFD1; --foot-rule:rgba(247,235,245,.18); --foot-accent:#FFB23E; --foot-glow:#FFB23E;
  /* over pictures, the dot screen, the call key */
  --veil:20,8,26; --veil-on:#F7EBF5; --dot-bg:#1E0C28; --dot-hue:-10deg;
  --key-a:#FFFFFF; --key-b:#F2D5E2; --key-on:#2B1437; --key-face:#2B1437; --key-face-on:#FFB23E; --key-shade:120,50,90; --key-well:60,10,0;
  /* the kitchen on the first screen (read by the script) */
  --k-wall:#4F2D62; --k-base:#FBE3EC; --k-tall:#FF5B3A; --k-island:#FFB23E; --k-stone:#FFFFFF; --k-handle:#2B1437; --k-dark:#1E0C28; --k-steel:#CDBED6; --k-glass:#FFD27A;
  --k-edge:#2B1437; --k-line:#FFB23E; --k-sheet:#1E0C28; --k-grid:#F7EBF5; --k-sky:#FFF0F6; --k-ground:#5A3A6A; --k-sun:#FFE6CC;

  --sans:"Geist","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  /* the type scale: seven steps, used everywhere */
  --t-display:600 clamp(2.5rem,5.3vw,4.5rem)/1.02 var(--sans);
  --t-h2:600 clamp(1.9rem,3.3vw,2.9rem)/1.06 var(--sans);
  --t-h3:600 clamp(1.25rem,1.6vw,1.45rem)/1.18 var(--sans);
  --t-lede:400 clamp(1.1rem,1.35vw,1.22rem)/1.5 var(--sans);
  --t-body:400 1.0625rem/1.55 var(--sans);
  --t-small:500 .9rem/1.4 var(--sans);
  --t-result:700 clamp(3rem,7vw,5.8rem)/.92 var(--sans);
  --grain:url(assets/img/grain.png);
  --pad:max(20px,env(safe-area-inset-left,0px));
  --r:20px; --r-sm:12px;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;
}
/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:76px;background:var(--page)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--page) var(--grain);color:var(--on);font:var(--t-body);letter-spacing:-.006em;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:clip}
img,svg,video,canvas{max-width:100%}
img{height:auto}
[hidden]{display:none!important}
h1,h2,h3,h4,p,figure,blockquote,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
a{color:inherit}
button{font:inherit;color:inherit}
::selection{background:var(--accent);color:var(--page)}
:focus-visible{outline:2px solid var(--glow);outline-offset:3px;border-radius:4px}
.wrap{width:100%;max-width:1240px;margin-inline:auto;padding-inline:var(--pad)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* the small drawing note: mono, tracked capitals. Used only for labels that name or measure something. */
.note{font:var(--t-small);letter-spacing:-.005em;color:var(--on-2)}
.note b{font-weight:500;color:var(--accent)}
.plus::before{content:"+";color:var(--accent);margin-right:.55em}

.link{color:var(--accent);text-decoration:underline;text-underline-offset:.22em;text-decoration-thickness:1px}
.link:hover{text-decoration-thickness:2px}

/* pill with a round arrow */
.pill{position:relative;display:inline-flex;align-items:center;justify-content:space-between;gap:16px;min-height:56px;padding:6px 6px 6px 24px;border-radius:999px;border:1px solid var(--rule-2);background:var(--well);color:var(--on);font:600 1.0625rem/1 var(--sans);letter-spacing:-.012em;text-decoration:none;cursor:pointer;transition:transform .25s var(--ease),background .25s,border-color .25s}
.pill .arr{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;border:1px solid currentColor;flex:none;transition:transform .35s var(--ease),background .25s,color .25s}
.pill .arr svg{width:18px;height:18px;display:block}
.pill:hover{border-color:var(--on)}
.pill:hover .arr{transform:rotate(-45deg)}
.pill.down:hover .arr{transform:translateY(3px)}
.pill:active{transform:scale(.98)}
.pill.solid{background:var(--btn) var(--grain);color:var(--btn-on);border-color:transparent}
.pill.solid .arr{background:var(--btn-on);color:var(--btn);border-color:var(--btn-on)}
.pill.solid:hover{background-color:var(--btn-hi)}
.pill.small{min-height:44px;padding:4px 4px 4px 18px;font-size:1rem;gap:12px}
.pill.small .arr{width:34px;height:34px}
.pill.small .arr svg{width:15px;height:15px}

/* registration marks on the four corners of a figure */
.reg{position:absolute;inset:0;pointer-events:none}
.reg i{position:absolute;width:19px;height:19px;background:linear-gradient(var(--rule-2),var(--rule-2)) center/1px 100% no-repeat,linear-gradient(var(--rule-2),var(--rule-2)) center/100% 1px no-repeat}
.reg i:nth-child(1){left:-9px;top:-9px}.reg i:nth-child(2){right:-9px;top:-9px}.reg i:nth-child(3){left:-9px;bottom:-9px}.reg i:nth-child(4){right:-9px;bottom:-9px}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--page) 82%,transparent);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top,0px)}
.top-in{display:flex;align-items:center;gap:8px 18px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;font:600 1.0625rem/1 var(--sans);letter-spacing:-.02em;text-decoration:none;flex:none}
.brand svg{width:24px;height:24px}
.nav{display:flex;gap:2px;margin-left:auto;min-width:0}
.nav a{font:400 1rem/1 var(--sans);color:var(--on-2);text-decoration:none;padding:12px 12px;white-space:nowrap;border-radius:999px;transition:color .2s}
.nav a:hover,.nav a[aria-current]{color:var(--on)}
.nav a[aria-current]{background:color-mix(in srgb,var(--on) 9%,transparent)}
.soc{display:flex;gap:0;flex:none}
.soc a{display:grid;place-items:center;width:42px;height:42px;color:var(--on-2);border-radius:50%}
.soc a:hover{color:var(--on)}
.soc svg{width:19px;height:19px}
.menu-btn{display:none;margin-left:auto;min-height:44px;padding:8px 16px;border:1px solid var(--rule-2);border-radius:999px;background:transparent;font:500 1rem/1 var(--sans);cursor:pointer}
.top-call svg{width:17px;height:17px}

/* full-screen menu on small screens: a plain list of big words */
.sheetnav{position:fixed;inset:0;z-index:60;background:var(--page-lo) var(--grain);padding:calc(env(safe-area-inset-top,0px) + 14px) var(--pad) calc(env(safe-area-inset-bottom,0px) + 24px);overflow:auto;display:none}
.sheetnav.on{display:block}
.sheetnav-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;min-height:50px}
.sheetnav a.big{display:flex;align-items:baseline;justify-content:space-between;gap:14px;font:500 2rem/1.1 var(--sans);letter-spacing:-.035em;text-decoration:none;padding:13px 0;border-bottom:1px solid var(--rule)}
.sheetnav a.big small{font:500 .9rem/1.2 var(--sans);letter-spacing:-.005em;color:var(--on-2);text-align:right}
.sheetnav .close{min-height:44px;padding:8px 16px;border:1px solid var(--rule-2);border-radius:999px;background:transparent;font:500 1rem/1 var(--sans);cursor:pointer}
.sheetnav .soc{margin-top:20px;gap:8px}
.sheetnav .soc a{border:1px solid var(--rule-2);width:50px;height:50px;color:var(--on)}

/* ---------- views ---------- */
.view{display:none}
.view.on{display:block}
.sec{padding-block:clamp(56px,7.5vw,112px)}
.sec.tight{padding-top:0}
.h2{font:var(--t-h2);letter-spacing:-.04em;text-wrap:balance;max-width:20ch}
.lede{font:var(--t-lede);letter-spacing:-.01em;color:var(--on-2);max-width:54ch;margin-top:16px}
.sec-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 40px;align-items:end;margin-bottom:clamp(26px,3.6vw,44px)}
.sec-head .note{align-self:start;margin-bottom:14px;grid-column:1/-1}

/* ---------- hero: what this is, who it is for, what to do next. The proof sits beside it. ---------- */
.hero{position:relative;overflow:clip;background:radial-gradient(60% 80% at 88% 8%,var(--hero-glow),transparent 62%)}
.hero-in{display:grid;grid-template-columns:minmax(0,1.14fr) minmax(0,.86fr);gap:clamp(24px,4.6vw,76px);align-items:center;padding-block:clamp(36px,6vw,92px) clamp(30px,4.4vw,64px)}
.hero h1{font:var(--t-display);letter-spacing:-.045em;text-wrap:balance}
.hero-lede{font:var(--t-lede);letter-spacing:-.01em;color:var(--on-2);max-width:44ch;margin-top:clamp(16px,2vw,24px)}
.hero-acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:clamp(22px,2.8vw,34px)}
.hero-trust{margin-top:18px;max-width:44ch}
.who{display:flex;align-items:center;gap:12px;margin-top:22px}
.who img{width:56px;height:56px;border-radius:50%;object-fit:cover;border:1px solid var(--rule-2);flex:none}
/* results so far: before struck out, after in bold */
.proof{border-radius:var(--r);padding:clamp(18px,2vw,26px) clamp(18px,2.2vw,28px) clamp(10px,1.2vw,16px);box-shadow:0 34px 70px -34px rgba(0,0,0,.6);min-width:0}
.proof h2{font:var(--t-small);color:var(--on-2);display:flex;justify-content:space-between;gap:12px;padding-bottom:10px;border-bottom:1px solid var(--rule-2)}
.proof li + li{border-top:1px solid var(--rule)}
.proof li a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 18px;align-items:center;padding:15px 0;text-decoration:none}
.p-what{font:600 1.0625rem/1.3 var(--sans);letter-spacing:-.02em}
.p-what small{display:block;font:400 .9rem/1.35 var(--sans);letter-spacing:0;color:var(--on-2);margin-top:3px}
.p-ba{display:grid;justify-items:end;gap:4px;text-align:right}
.p-ba s{font:400 .9rem/1 var(--sans);color:var(--on-2);text-decoration-color:var(--accent);text-decoration-thickness:1.5px}
.p-ba b{font:700 clamp(1.45rem,2.2vw,1.9rem)/1 var(--sans);letter-spacing:-.045em}
.proof li a:hover .p-what{text-decoration:underline;text-underline-offset:.2em;text-decoration-thickness:1px}
/* who the work is for, right under the first screen */
.clients{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 30px;padding-block:18px 22px;border-top:1px solid var(--rule)}
.clients > span{font:var(--t-small);color:var(--on-2)}
.clients ul{display:flex;flex-wrap:wrap;gap:6px 30px}
.clients a{font:600 1.0625rem/1.3 var(--sans);letter-spacing:-.02em;text-decoration:none}
.clients a:hover{color:var(--accent)}

/* ---------- what gets fixed: six kinds of work, each tied to a finished job ---------- */
.svc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--rule)}
.svc li{position:relative;display:grid;gap:8px;align-content:start;padding:24px 26px 26px 0;border-bottom:1px solid var(--rule);min-width:0}
.svc li:not(:nth-child(3n+1)){padding-left:26px;border-left:1px solid var(--rule)}
.svc li:not(:nth-child(3n+1))::before{content:"+";position:absolute;left:-5px;top:-11px;font:400 1rem/1 var(--sans);color:var(--accent)}
.svc h3{font:var(--t-h3);letter-spacing:-.03em}
.svc p{color:var(--on-2);font-size:1rem;line-height:1.5}
.svc a{justify-self:start;margin-top:4px;font:var(--t-small);color:var(--accent);text-decoration:underline;text-underline-offset:.22em;text-decoration-thickness:1px}
.svc a:hover{text-decoration-thickness:2px}

/* ---------- the sample kitchen that draws itself (inside the kitchen job) ---------- */
/* a look-around: one photoreal panorama, drag to turn */
.pano{position:relative;display:block;width:100%;aspect-ratio:16/10.6;border-radius:var(--r-sm);overflow:hidden;background:var(--dot-bg);touch-action:pan-y;cursor:grab;-webkit-user-select:none;user-select:none}
.pano:active{cursor:grabbing}
.pano:focus-visible{outline:2px solid var(--glow);outline-offset:3px}
.pano img,.pano canvas{position:absolute;inset:0;width:100%!important;height:100%!important;object-fit:cover;display:block}
.pano canvas{opacity:0;transition:opacity .6s}
.pano.live canvas{opacity:1}
.pano-tip{position:absolute;left:10px;bottom:10px;padding:7px 12px;border-radius:999px;background:rgba(var(--veil),.74);color:var(--veil-on);font:var(--t-small);pointer-events:none;transition:opacity .4s}
.pano.used .pano-tip{opacity:0}
/* a second picture under the main one of a job */
.also{all:unset;box-sizing:border-box;display:grid;grid-template-columns:108px minmax(0,1fr);gap:14px;align-items:center;width:100%;padding:8px;border-radius:var(--r-sm);border:1px solid var(--rule);cursor:zoom-in}
.also img{display:block;width:100%;height:auto;aspect-ratio:16/10.4;object-fit:cover;object-position:0 0;border-radius:6px;background:#fff}
.also b{display:block;font:600 1rem/1.25 var(--sans);letter-spacing:-.02em}
.also span span{display:block;font:var(--t-small);color:var(--on-2);margin-top:3px}
.also:hover{border-color:var(--rule-2)}
.also:focus-visible{outline:2px solid var(--glow);outline-offset:3px}
.stage{position:relative;min-width:0;display:grid;grid-template-columns:minmax(0,1fr)}
.stage-gl{grid-area:1/1;position:relative;width:100%;aspect-ratio:16/10.6;border-radius:var(--r-sm);background:var(--dot-bg);overflow:hidden;touch-action:pan-y;cursor:grab}
.stage-gl:active{cursor:grabbing}
.stage-gl canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block;opacity:0;transition:opacity .6s}
.stage.live .stage-gl canvas{opacity:1}
.stage-gl img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.dimtag{position:absolute;left:0;top:0;font:500 .9rem/1 var(--sans);color:var(--k-line);background:var(--dot-bg);padding:3px 6px;border-radius:3px;transform:translate(-50%,-50%);white-space:nowrap;pointer-events:none;opacity:0;will-change:transform,opacity}
.stage-foot{grid-area:2/1;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;align-items:center;margin-top:8px}
.scrub{display:flex;align-items:center;gap:10px;font:var(--t-small);color:var(--on-2)}
.scrub input{-webkit-appearance:none;appearance:none;width:clamp(120px,14vw,190px);height:28px;background:transparent;cursor:ew-resize;margin:0}
.scrub input::-webkit-slider-runnable-track{height:1.5px;background:var(--rule-2)}
.scrub input::-moz-range-track{height:1.5px;background:var(--rule-2)}
.scrub input::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-11px;border-radius:50%;background:var(--on);border:6px solid var(--page);box-shadow:0 0 0 1.5px var(--accent)}
.scrub input::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--on);border:5px solid var(--page);box-shadow:0 0 0 1.5px var(--accent)}
.ticket{grid-area:1/1;align-self:end;justify-self:end;position:relative;z-index:2;margin:0 10px 10px 0;width:184px;background:var(--card) var(--grain);color:var(--card-on);border-radius:10px;padding:11px 13px 8px;font:500 .9rem/1.3 var(--sans);box-shadow:0 18px 40px -18px rgba(0,0,0,.6);opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s var(--ease)}
.stage.priced .ticket{opacity:1;transform:none}
.ticket b{display:block;font:600 1rem/1.1 var(--sans);letter-spacing:-.02em;margin-bottom:7px}
.ticket div{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-top:1px dashed var(--card-rule-2)}
.ticket dt{color:var(--card-on-2)}
.ticket dd{text-align:right}

/* ---------- common questions ---------- */
.faq-in{display:grid;grid-template-columns:minmax(0,.72fr) minmax(0,1.28fr);gap:clamp(22px,4.6vw,72px);align-items:start}
.faq details{border-top:1px solid var(--rule)}
.faq details:last-child{border-bottom:1px solid var(--rule)}
.faq summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:17px 0;font:600 1.0625rem/1.3 var(--sans);letter-spacing:-.02em}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font:400 1.5rem/1 var(--sans);color:var(--accent);flex:none}
.faq details[open] summary::after{content:"\2013"}
.faq p{padding:0 0 18px;color:var(--on-2);max-width:62ch}

/* ---------- materials other than the page ---------- */
/* a card lying on the page. The same components work on it because it re-points the tokens. */
.paper{--page:var(--card);--on:var(--card-on);--on-2:var(--card-on-2);--accent:var(--card-accent);--glow:var(--card-glow);--rule:var(--card-rule);--rule-2:var(--card-rule-2);--well:transparent;--btn:var(--card-btn);--btn-hi:var(--card-btn-hi);--btn-on:var(--card-btn-on);
  --b1:var(--cb1);--b2:var(--cb2);--b3:var(--cb3);--b4:var(--cb4);--b1-on:var(--cb1-on);--b2-on:var(--cb2-on);--b3-on:var(--cb3-on);background:var(--card) var(--grain);color:var(--card-on);color-scheme:light}
.paper ::selection{background:var(--card-on);color:var(--card)}
/* full-width loud bands */
.band{padding-block:clamp(56px,7.5vw,112px)}
.alt{--page:var(--band);--on:var(--band-on);--on-2:var(--band-on-2);--accent:var(--band-accent);--rule:var(--band-rule);--rule-2:var(--band-rule-2);--well:var(--band-well);--btn:var(--band-btn);--btn-hi:var(--band-btn-hi);--btn-on:var(--band-btn-on);
  background:radial-gradient(80% 90% at 22% 0%,var(--band-glow),transparent 62%),var(--band) var(--grain);color:var(--band-on)}

/* a picture that opens large */
.shot{all:unset;box-sizing:border-box;position:relative;display:block;width:100%;cursor:zoom-in;border-radius:var(--r-sm);overflow:hidden;background:var(--dot-bg)}
.shot img{display:block;width:100%;height:auto}
.shot:focus-visible{outline:2px solid var(--glow);outline-offset:3px}
figcaption.note,.cap{text-transform:none;letter-spacing:.01em;font-size:.9rem}

/* dot-matrix reveal: a picture first shows as amber dots on a dark screen, then resolves into itself */
@property --dot{syntax:"<length>";inherits:false;initial-value:6px}
.dots{background:var(--dot-bg)}
.shot.dots:not(.done){background:var(--dot-bg)}
.dots img,.dots video{--dot:6px;-webkit-mask:radial-gradient(circle,#000 var(--dot),transparent calc(var(--dot) + .8px)) 50% 50%/8px 8px;mask:radial-gradient(circle,#000 var(--dot),transparent calc(var(--dot) + .8px)) 50% 50%/8px 8px;transition:--dot 1.15s cubic-bezier(.55,0,.35,1),filter .85s ease .3s}
.dots.raw img,.dots.raw video{--dot:2.2px;filter:grayscale(1) sepia(1) saturate(2.6) hue-rotate(var(--dot-hue)) brightness(1.55) contrast(1.3)}
.dots.raw.inv img,.dots.raw.inv video{filter:grayscale(1) invert(1) sepia(1) saturate(2.6) hue-rotate(var(--dot-hue)) brightness(1.1) contrast(1.5)}
.dots.cut img,.dots.cut video{transition:none}
.dots.done img,.dots.done video{-webkit-mask:none;mask:none}
@media (prefers-reduced-motion:reduce){.dots img,.dots video{transition:none}}

/* ---------- cases: one screen, six jobs ---------- */
.tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-top:1px solid var(--rule)}
.tabs button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:7px;align-content:start;padding:14px 14px 16px 0;border-top:2px solid transparent;margin-top:-1px;min-width:0;color:var(--on-2);transition:color .2s,border-color .2s}
.tabs button + button{padding-left:14px;border-left:1px solid var(--rule)}
.tabs b{font:500 1rem/1.15 var(--sans);letter-spacing:-.02em}
.tabs small{font:500 .9rem/1.35 var(--sans);letter-spacing:-.005em}
.tabs button:hover{color:var(--on)}
.tabs button[aria-selected="true"]{color:var(--on);border-top-color:var(--accent)}
.tabs button[aria-selected="true"] small{color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--glow);outline-offset:-2px}
.case{display:grid;grid-template-columns:minmax(0,1.04fr) minmax(0,1fr);grid-template-areas:"fig body" "ver ver";gap:clamp(16px,2.2vw,30px) clamp(18px,3vw,46px);padding:clamp(12px,1.8vw,24px);border-radius:var(--r);margin-top:6px}
.case-fig{grid-area:fig;display:grid;gap:10px;align-content:start;min-width:0}
.case-fig .shot img{aspect-ratio:16/9.4;object-fit:cover;object-position:0 0}
.case-body{grid-area:body;display:grid;gap:clamp(13px,1.5vw,19px);align-content:start;min-width:0;padding:clamp(4px,.8vw,10px) clamp(0px,1vw,12px) 0 0}
.case h3{font:var(--t-h3);letter-spacing:-.03em;margin-top:6px;text-wrap:balance}
.pd{display:grid;gap:12px}
.pd dt{font:500 .9rem/1.3 var(--sans);letter-spacing:-.005em;color:var(--accent);margin-bottom:3px}
.pd dd{max-width:54ch}
.verdict{grid-area:ver;border-top:1px solid var(--rule-2);padding:16px clamp(0px,1vw,12px) 4px 0;display:grid;grid-template-columns:minmax(0,1.04fr) minmax(0,1fr);gap:10px clamp(18px,3vw,46px);align-items:start}
.verdict-l{display:grid;gap:6px;justify-items:start;min-width:0}
.verdict-r{display:grid;gap:10px;justify-items:start;min-width:0}
.was{font:400 .9rem/1.2 var(--sans);color:var(--on-2)}
.was s{text-decoration-color:var(--accent)}
.now{font:var(--t-result);letter-spacing:-.055em;margin:4px 0 0 -3px;overflow-wrap:anywhere}
.facts{display:grid;gap:6px}
.facts li{position:relative;padding-left:20px;max-width:54ch;font-size:1rem;line-height:1.45}
.facts li::before{content:"+";position:absolute;left:0;top:0;font:500 1rem/1.45 var(--sans);color:var(--accent)}
.facts b{font-weight:600}
.when{margin-top:2px}
.case-links{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:2px}
.case-nav{display:flex;align-items:center;gap:14px;margin-top:14px}
.bar{display:flex;height:30px;margin-top:2px;border-radius:6px;overflow:hidden;width:100%}
.bar div{display:flex;align-items:center;justify-content:center;font:500 .9rem/1 var(--sans);min-width:0}
.bar div:nth-child(1){background:var(--b1);color:var(--b1-on)}.bar div:nth-child(2){background:var(--b2);color:var(--b2-on)}.bar div:nth-child(3){background:var(--b3);color:var(--b3-on)}.bar div:nth-child(4){background:var(--b4)}
.bar-key{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:-2px;font:500 .9rem/1.4 var(--sans);letter-spacing:-.005em;color:var(--on-2)}
.bar-key i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.bar-key span:nth-child(1) i{background:var(--b1)}.bar-key span:nth-child(2) i{background:var(--b2)}.bar-key span:nth-child(3) i{background:var(--b3)}.bar-key span:nth-child(4) i{background:var(--b4)}

/* ---------- client pages: a row of real proposals and invoices ---------- */
.pages{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(250px,26vw,330px);gap:16px;overflow-x:auto;scroll-snap-type:x proximity;scroll-padding-inline:var(--pad);padding:6px var(--pad) 18px;margin-inline:calc(var(--pad) * -1);scrollbar-width:thin;scrollbar-color:var(--rule-2) transparent}
.page{scroll-snap-align:start;display:grid;gap:10px;align-content:start;min-width:0}
.page .shot{background:#FFFDF7;box-shadow:0 22px 40px -22px rgba(0,0,0,.65);border-radius:10px}
.page .shot img{aspect-ratio:1/1.02;object-fit:cover;object-position:0 0}
.page b{display:block;font:600 1.0625rem/1.2 var(--sans);letter-spacing:-.02em}
.page span{display:block;font-size:1rem;line-height:1.4;color:var(--on-2);margin-top:3px}
.pages-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 24px;margin-top:6px}
.pages-nav{display:flex;gap:8px}
.rb{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1px solid var(--rule-2);background:transparent;cursor:pointer;transition:border-color .2s}
.rb:hover{border-color:var(--on)}
.rb svg{width:18px;height:18px}

/* ---------- the live builder ---------- */
.stagebox{position:relative;border-radius:var(--r);overflow:hidden;background:var(--dot-bg);border:1px solid var(--rule)}
.stage-view{position:relative;aspect-ratio:16/9.4;overflow:hidden}
.stage-view img,.stage-view video,.stage-view iframe{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0}
.stage-view iframe{background:#fff}
.stage-view.live{aspect-ratio:auto;height:min(82vh,780px)}
.stage-go{position:absolute;inset:auto 0 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:40px 16px 16px;background:linear-gradient(transparent,rgba(var(--veil),.9))}
.stage-go > span{font-size:1rem;color:var(--veil-on)}
.builder-in{display:grid;grid-template-columns:minmax(0,.62fr) minmax(0,1.38fr);gap:clamp(20px,3.6vw,56px);align-items:center}

/* ---------- where the businesses are ---------- */
.where{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:clamp(20px,3.6vw,56px);align-items:start}
.map{position:relative;border:1px solid var(--rule);border-radius:var(--r);background:radial-gradient(circle,color-mix(in srgb,var(--on) 14%,transparent) 1px,transparent 1.4px) 0 0/14px 14px,var(--page-lo);overflow:hidden}
.map svg{display:block;width:100%;height:auto}
.map text{font:500 16px var(--sans);fill:var(--on-2)}
.map .t-b{fill:var(--on);font-size:17px}
.map .t-m{fill:var(--accent)}
.map .ln{stroke:var(--accent);stroke-width:1;fill:none}
.map .dash{stroke:var(--rule-2);stroke-width:1;stroke-dasharray:3 5;fill:none}
.map .pin{fill:var(--glow)}
.map .ring{fill:none;stroke:var(--glow);stroke-width:1.2;transform-origin:center;transform-box:fill-box;animation:ping 2.8s ease-out infinite}
@keyframes ping{from{transform:scale(.6);opacity:.9}to{transform:scale(2.8);opacity:0}}
@media (prefers-reduced-motion:reduce){.map .ring{animation:none}}
.places{display:grid;border-top:1px solid var(--rule)}
.places li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--rule)}
.places b{font:500 1rem/1.25 var(--sans);letter-spacing:-.02em}
.places span{grid-column:1;font-size:1rem;color:var(--on-2)}
.places a{grid-row:1/3;grid-column:2;align-self:center;font:500 .9rem/1 var(--sans);letter-spacing:-.005em;color:var(--accent);text-decoration:none;padding:10px 0 10px 10px}
.places a:hover{text-decoration:underline;text-underline-offset:.25em}

/* ---------- how a first day goes ---------- */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--rule)}
.steps li{position:relative;padding:18px 20px 4px 0;min-width:0}
.steps li + li{padding-left:20px;border-left:1px solid var(--rule)}
.steps li + li::before{content:"+";position:absolute;left:-5px;top:-11px;font:400 .9rem/1 var(--sans);color:var(--accent)}
.steps time{display:block;font:500 .9rem/1.3 var(--sans);letter-spacing:-.005em;color:var(--accent)}
.steps h3{font:var(--t-h3);letter-spacing:-.03em;margin:8px 0 8px}
.steps p{color:var(--on-2);font-size:1rem}
.rule-note{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 22px;align-items:start;margin-top:clamp(26px,3.6vw,44px);padding:20px 22px;border-radius:var(--r);border:1px solid var(--rule);background:var(--well)}
.rule-note > p{font:var(--t-lede);letter-spacing:-.01em;max-width:62ch}
.forwho{grid-column:2;display:flex;flex-wrap:wrap;gap:6px}
.forwho li{font:500 .9rem/1 var(--sans);letter-spacing:-.005em;padding:8px 11px;border:1px solid var(--rule-2);border-radius:999px;color:var(--on-2)}

/* ---------- the month and the workshop ---------- */
.month{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.02fr);gap:clamp(22px,4vw,64px);align-items:start}
.shopbox{border-radius:var(--r);overflow:hidden}
.shopbox-top{padding:22px 24px 4px}
.shopbox h3{font:var(--t-h3);letter-spacing:-.03em}
.shopbox-top p{color:var(--on-2);margin-top:8px;font-size:1rem}
.form{display:grid;gap:13px;padding:18px 24px 24px}
.form label{display:grid;gap:6px;font:500 .9rem/1.2 var(--sans);letter-spacing:-.005em;color:var(--on-2)}
.form label span{text-transform:none;letter-spacing:.01em}
.form input[type=text],.form input[type=tel],.form input[type=email],.form textarea{width:100%;font:400 1rem/1.4 var(--sans);letter-spacing:-.006em;text-transform:none;color:var(--on);background:var(--field);border:1px solid var(--rule-2);border-radius:10px;padding:12px 13px;min-height:50px}
.form input:focus,.form textarea:focus{outline:2px solid var(--glow);outline-offset:0;border-color:transparent}
.form textarea{resize:vertical;min-height:88px}
.form .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.form .pick{display:flex;flex-wrap:wrap;gap:8px 18px;border:0;padding:0;margin:0;min-width:0}
.form .pick legend{font:500 .9rem/1.2 var(--sans);letter-spacing:-.005em;color:var(--on-2);padding:0;margin-bottom:8px}
.form .pick label{display:flex;grid-template-columns:none;align-items:center;gap:8px;font:400 1rem/1.2 var(--sans);letter-spacing:-.006em;text-transform:none;color:var(--on);cursor:pointer}
.form input[type=radio],.form input[type=checkbox]{width:20px;height:20px;accent-color:var(--on);margin:0}
.form-act{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:2px}
.form-act button{border-width:0}
.form-msg{font-weight:500;font-size:1rem}
.hp{position:absolute!important;left:-9999px!important;width:1px;height:1px;opacity:0}

/* ---------- nine kinds of work, one line each ---------- */
.skills{border-top:1px solid var(--rule)}
.skills li{display:grid;grid-template-columns:19rem minmax(0,1fr) 12.5rem;gap:6px 26px;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--rule)}
.skills b{font:600 1.0625rem/1.25 var(--sans);letter-spacing:-.02em}
.skills p{color:var(--on-2);font-size:1rem;line-height:1.45}
.skills .w{font:500 .9rem/1.5 var(--sans);letter-spacing:-.005em;white-space:nowrap;text-align:right}
.skills .w a{color:var(--accent);text-decoration:none}
.skills .w a:hover{text-decoration:underline;text-underline-offset:.25em}

/* ---------- video wall (appears when clips are added) ---------- */
.reel-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,240px);gap:clamp(20px,4vw,56px);align-items:end;margin-bottom:clamp(24px,3.4vw,40px)}
.kit{border-radius:var(--r-sm);overflow:hidden;background:var(--well);border:1px solid var(--rule)}
.kit img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.kit figcaption{font:500 .9rem/1.3 var(--sans);letter-spacing:-.005em;color:var(--on-2);padding:8px 10px 10px}
.reels{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.51fr);gap:12px;align-items:start}
.reels-v{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.reels-h{display:grid;gap:12px}
.reel{position:relative;border-radius:var(--r-sm);background:rgb(var(--veil));overflow:hidden}
.reel video{display:block;width:100%;height:auto;aspect-ratio:var(--ar,9/16);object-fit:cover}
.reel button{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;background:transparent;cursor:pointer;display:flex;align-items:flex-end;text-align:left}
.reel .cap{display:flex;align-items:center;gap:12px;width:100%;padding:40px 12px 12px;background:linear-gradient(transparent,rgba(var(--veil),.9));color:var(--veil-on);font:500 1rem/1.25 var(--sans);transition:opacity .25s}
.reel .play{flex:none;width:42px;height:42px;border-radius:50%;background:var(--veil-on);display:grid;place-items:center}
.reel .play::before{content:"";border-left:12px solid rgb(var(--veil));border-top:7.5px solid transparent;border-bottom:7.5px solid transparent;margin-left:4px}
.reel.playing .play::before{border:0;width:12px;height:14px;border-left:4px solid rgb(var(--veil));border-right:4px solid rgb(var(--veil));margin:0}
.reel.playing .cap{opacity:0}
.reel.playing:hover .cap,.reel.playing button:focus-visible .cap{opacity:1}

/* ---------- what the owners say ---------- */
.words{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.word{display:flex;flex-direction:column;gap:20px;padding:clamp(18px,2.2vw,26px);border-radius:var(--r);border:1px solid var(--rule);background:var(--well);min-width:0}
.word blockquote{font:400 1.0625rem/1.48 var(--sans);letter-spacing:-.012em}
.word figcaption{margin-top:auto;display:flex;align-items:center;gap:12px}
.seal{flex:none;display:grid;place-items:center;width:44px;height:44px;font:600 1.0625rem/1 var(--sans);border-radius:50%;border:1px solid var(--accent);color:var(--accent);box-shadow:inset 0 0 0 3px var(--page),inset 0 0 0 4px color-mix(in srgb,var(--accent) 50%,transparent)}
.word b{display:block;font:600 1.0625rem/1.1 var(--sans);letter-spacing:-.02em}
.word a{font:500 .9rem/1.3 var(--sans);letter-spacing:-.005em;color:var(--on-2);text-decoration:none;display:inline-block;margin-top:5px}
.word a:hover{color:var(--accent)}
.pull{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:clamp(22px,4vw,60px);margin-top:clamp(28px,4vw,48px);align-items:start}
.pull blockquote{font:var(--t-lede);letter-spacing:-.01em;max-width:48ch}
.pull cite{display:block;margin-top:12px;font:500 .9rem/1.5 var(--sans);letter-spacing:-.005em;font-style:normal;color:var(--on-2)}
.stars{display:flex;flex-direction:row-reverse;justify-content:flex-end;gap:2px}
.stars input{position:absolute;opacity:0;width:1px;height:1px}
.stars label{display:block;font:400 1.9rem/1 var(--sans);color:var(--rule-2);cursor:pointer;padding:4px;text-transform:none}
.stars input:checked ~ label,.stars label:hover,.stars label:hover ~ label{color:var(--accent)}
.stars input:focus-visible + label{outline:2px solid var(--glow)}
details.rev-form{border-radius:var(--r);overflow:hidden}
details.rev-form summary{cursor:pointer;list-style:none;padding:18px 22px;font:600 1.0625rem/1.2 var(--sans);letter-spacing:-.02em;display:flex;justify-content:space-between;align-items:center;gap:12px}
details.rev-form summary::-webkit-details-marker{display:none}
details.rev-form summary::after{content:"+";font:400 1.5rem/1 var(--sans);color:var(--accent)}
details.rev-form[open] summary::after{content:"\2013"}
details.rev-form[open] summary{border-bottom:1px solid var(--rule)}

/* ---------- about ---------- */
.me{display:grid;grid-template-columns:minmax(0,.7fr) minmax(0,1.3fr);gap:clamp(22px,4.6vw,72px);align-items:start}
.me.solo{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.me-photo{border-radius:var(--r);overflow:hidden}
.me-photo img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}
.me-text p{font:var(--t-lede);letter-spacing:-.01em;max-width:56ch}
.me-text p + p{margin-top:14px}
.route{display:grid;border-top:1px solid var(--rule)}
.route li{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:4px 18px;padding:12px 0;border-bottom:1px solid var(--rule)}
.route span{font:500 .9rem/1.45 var(--sans);letter-spacing:-.005em;color:var(--on-2)}
.route b{font:500 1rem/1.25 var(--sans);letter-spacing:-.02em;display:block}
.route p{font-size:1rem;line-height:1.4;color:var(--on-2);margin-top:2px}
.give{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:clamp(26px,3.6vw,44px)}
.give div{padding:clamp(18px,2.2vw,26px);border-radius:var(--r);border:1px solid var(--rule);background:var(--well)}
.give h3{font:var(--t-h3);letter-spacing:-.03em}
.give p{color:var(--on-2);margin-top:8px;font-size:1rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips li{font:500 .9rem/1 var(--sans);letter-spacing:-.005em;padding:9px 12px;border:1px solid var(--rule-2);border-radius:999px;color:var(--on-2)}
.chips li.k{color:var(--on);border-color:var(--accent)}

/* ---------- contact: the leather band ---------- */
.reach{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,4.6vw,72px);align-items:end}
.reach h2{font:var(--t-display);letter-spacing:-.045em;text-wrap:balance;max-width:14ch}
/* the one button that is nice to press: a raised key in a well */
.tact{position:relative;display:inline-flex;align-items:center;gap:16px;margin:clamp(24px,3vw,36px) 10px 10px;padding:18px 28px 18px 18px;border-radius:26px;text-decoration:none;color:var(--key-on);cursor:pointer;-webkit-tap-highlight-color:transparent;
  --ring:0 0 0 10px rgba(var(--key-well),.3),0 0 0 11px rgba(255,255,255,.16);
  background:linear-gradient(180deg,var(--key-a),var(--key-b));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.85),inset 0 -4px 8px rgba(var(--key-shade),.28),0 12px 22px -8px rgba(0,0,0,.55),var(--ring);
  transition:transform .12s var(--ease),box-shadow .12s var(--ease)}
.tact:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.85),inset 0 -4px 8px rgba(var(--key-shade),.28),0 12px 22px -8px rgba(0,0,0,.55),var(--ring),0 0 44px 4px color-mix(in srgb,var(--glow) 45%,transparent)}
.tact:active,.tact.dn{transform:translateY(4px) scale(.985);box-shadow:inset 0 3px 8px rgba(var(--key-shade),.42),inset 0 -1px 2px rgba(255,255,255,.5),0 2px 4px -2px rgba(0,0,0,.55),var(--ring),0 0 36px 2px color-mix(in srgb,var(--glow) 55%,transparent)}
.tact i{display:grid;place-items:center;width:52px;height:52px;border-radius:17px;background:var(--key-face);color:var(--key-face-on);flex:none}
.tact i svg{width:23px;height:23px}
.tact b{display:block;font:500 clamp(1.5rem,2.6vw,2rem)/1 var(--sans);letter-spacing:-.04em}
.tact small{display:block;font:500 .9rem/1 var(--sans);letter-spacing:-.005em;color:color-mix(in srgb,var(--key-on) 72%,transparent);margin-bottom:6px}
.spark{position:absolute;left:var(--x);top:var(--y);width:5px;height:5px;margin:-2.5px;border-radius:50%;background:var(--glow);pointer-events:none;animation:spark .7s var(--ease) forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.reach-rows{border-top:1px solid var(--rule)}
.reach-row{display:grid;grid-template-columns:minmax(0,7.2rem) minmax(0,1fr);gap:6px 14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--rule)}
.reach-row dt{font:500 .9rem/1.3 var(--sans);letter-spacing:-.005em;color:var(--on-2)}
.reach-row dd{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-width:0}
.reach-big{font:600 1.0625rem/1.2 var(--sans);letter-spacing:-.02em;text-decoration:none;overflow-wrap:anywhere;margin-right:4px}
.reach-big:hover{text-decoration:underline;text-underline-offset:.2em}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:6px 14px;border:1px solid var(--rule-2);border-radius:999px;background:transparent;color:var(--on);font:500 .9rem/1 var(--sans);text-decoration:none;cursor:pointer}
.chip:hover{border-color:var(--on)}
.chip svg{width:16px;height:16px}
.reach-side{display:grid;gap:18px;min-width:0}
.visit{display:grid;gap:10px;text-decoration:none;padding:clamp(18px,2.2vw,26px);border-radius:var(--r);border:1px solid var(--rule);background:var(--well)}
.visit b{display:block;font:var(--t-h3);letter-spacing:-.03em}
.visit span{display:block;color:var(--on-2);font-size:1rem}
.visit u{font:500 .9rem/1 var(--sans);letter-spacing:-.005em;color:var(--accent);text-underline-offset:.3em}

/* ---------- business pages ---------- */
.back{display:inline-flex;align-items:center;gap:8px;min-height:44px;font:500 .9rem/1 var(--sans);letter-spacing:-.005em;color:var(--on-2);text-decoration:none;margin-bottom:10px}
.back:hover{color:var(--on)}
.back svg{width:16px;height:16px}
.phead{padding-block:clamp(24px,3.6vw,48px) clamp(24px,3.6vw,44px)}
.phead h1{font:var(--t-display);letter-spacing:-.045em;text-wrap:balance;max-width:16ch}
.phead .meta{font-size:1.0625rem;color:var(--on-2);margin-top:14px;max-width:60ch}
.plinks{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.plinks a{display:inline-flex;align-items:center;min-height:40px;padding:6px 14px;border:1px solid var(--rule-2);border-radius:999px;font:500 .9rem/1 var(--sans);text-decoration:none}
.plinks a:hover{border-color:var(--on)}
.pdc3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-radius:var(--r);overflow:hidden}
.pdc3 > div{padding:clamp(18px,2.4vw,28px);min-width:0}
.pdc3 > div + div{border-left:1px solid var(--rule)}
.pdc3 h2{font:500 .9rem/1.3 var(--sans);letter-spacing:-.005em;color:var(--accent);margin-bottom:8px}
.pdc3 .now{font-size:clamp(1.9rem,3.2vw,2.8rem);line-height:1;margin:0 0 10px -1px}
.figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-block:1px solid var(--rule);margin-top:clamp(24px,3.4vw,40px)}
.figs div{padding:18px 18px 20px 0;min-width:0}
.figs div + div{padding-left:18px;border-left:1px solid var(--rule)}
.figs b{display:block;font:var(--t-h2);letter-spacing:-.04em}
.figs span{display:block;margin-top:8px;font-size:1rem;line-height:1.4;color:var(--on-2)}
.did{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 clamp(24px,4vw,56px);border-top:1px solid var(--rule)}
.did li{padding:16px 0;border-bottom:1px solid var(--rule)}
.did b{display:block;font:600 1.0625rem/1.2 var(--sans);letter-spacing:-.02em}
.did span{display:block;margin-top:5px;color:var(--on-2);font-size:1rem}
.feature{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:clamp(20px,4vw,56px);align-items:center}
.feature h3{font:var(--t-h3);letter-spacing:-.03em}
.feature p{color:var(--on-2);margin-top:10px}
.feature .pill{margin-top:18px}
.locs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.loc{padding:clamp(18px,2.2vw,26px);border-radius:var(--r);border:1px solid var(--rule);background:var(--well);min-width:0}
.loc b{display:block;font:var(--t-h3);letter-spacing:-.03em}
.loc span{display:block;color:var(--on-2);margin-top:5px}
.sub-h{font:var(--t-h2);letter-spacing:-.04em;margin-bottom:clamp(16px,2.4vw,26px);text-wrap:balance}
.sub-p{color:var(--on-2);max-width:60ch;margin:-8px 0 clamp(16px,2.4vw,26px)}
.next{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:24px 0;border-top:1px solid var(--rule);text-decoration:none}
.next span{font:500 .9rem/1 var(--sans);letter-spacing:-.005em;color:var(--on-2)}
.next b{font:var(--t-h3);letter-spacing:-.03em}
.next:hover b{color:var(--accent)}
.cta{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 32px;padding:clamp(20px,3vw,34px);border-radius:var(--r)}
.cta h2{font:var(--t-h3);letter-spacing:-.03em;max-width:24ch;text-wrap:balance}
.cta-acts{display:flex;flex-wrap:wrap;gap:8px}

/* galleries */
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.filters button{min-height:40px;padding:6px 14px;border:1px solid var(--rule-2);border-radius:999px;background:transparent;font:500 .9rem/1 var(--sans);cursor:pointer}
.filters button:hover{border-color:var(--on)}
.filters button[aria-pressed="true"]{background:var(--btn) var(--grain);border-color:transparent;color:var(--btn-on)}
.filters small{font:500 .9rem/1 var(--sans);opacity:.7;margin-left:7px}
.wall{columns:3 280px;column-gap:12px}
.wall.sheets{columns:2 420px}
.wall button{all:unset;box-sizing:border-box;cursor:zoom-in;display:block;break-inside:avoid;margin-bottom:12px;width:100%;border-radius:var(--r-sm);overflow:hidden;background:var(--well);border:1px solid var(--rule)}
.wall button:hover{border-color:var(--rule-2)}
.wall button:focus-visible{outline:2px solid var(--glow);outline-offset:3px}
.wall img{display:block;width:100%;height:auto;background:var(--page-lo)}
.wall .c{display:block;padding:9px 11px 11px;font-size:.9rem;line-height:1.35;color:var(--on-2)}
.more-btn{display:flex;justify-content:center;margin-top:10px}
.catnote{margin:-4px 0 16px;color:var(--on-2);max-width:70ch;min-height:1.6em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.grid button{all:unset;box-sizing:border-box;cursor:zoom-in;position:relative;overflow:hidden;background:var(--page-lo);border-radius:var(--r-sm);aspect-ratio:4/3}
.grid img{display:block;width:100%;height:100%;object-fit:cover}
.grid button span{position:absolute;inset:auto 0 0 0;padding:28px 11px 10px;font-size:.9rem;line-height:1.3;color:var(--veil-on);background:linear-gradient(transparent,rgba(var(--veil),.9));opacity:0;transition:opacity .2s}
.grid button:hover span,.grid button:focus-visible span{opacity:1}
.grid button:focus-visible{outline:2px solid var(--glow);outline-offset:3px}
@media (hover:none){.grid button span{opacity:1}}

/* loupe on drawings (mouse only) */
.loupe{position:absolute;width:210px;height:210px;border-radius:50%;border:1px solid var(--accent);background-repeat:no-repeat;background-color:#fff;pointer-events:none;box-shadow:0 18px 40px rgba(0,0,0,.5);display:none;z-index:3}

/* lightbox */
dialog.lb{max-width:min(1500px,96vw);max-height:94vh;width:auto;padding:0;border:0;border-radius:var(--r-sm);background:var(--card);color:var(--card-on);overflow:hidden}
dialog.lb::backdrop{background:rgba(var(--veil),.92)}
.lb img{display:block;max-width:min(1500px,96vw);max-height:calc(94vh - 60px);width:auto;height:auto;margin:auto;background:#fff;touch-action:pan-y}
.lbbar{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 14px;font-size:1rem}
.lbbar span{flex:1;min-width:0;color:var(--card-on-2)}
.lbbar button{min-height:44px;min-width:44px;padding:6px 14px;border:1px solid var(--card-rule-2);border-radius:999px;background:transparent;color:var(--card-on);font:500 .9rem/1 var(--sans);cursor:pointer}
.lbbar button:hover{border-color:var(--card-on)}

/* ---------- footer: the number, in lights ---------- */
.foot{--page:var(--foot);--on:var(--foot-on);--on-2:var(--foot-on-2);--rule:var(--foot-rule);--accent:var(--foot-accent);--glow:var(--foot-glow);background:var(--foot) var(--grain);border-top:1px solid var(--rule);padding-block:clamp(28px,4vw,48px) calc(28px + env(safe-area-inset-bottom,0px));overflow:clip}
.foot-in{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:22px 40px;font-size:1rem;color:var(--on-2)}
.foot b{display:block;font:500 .9rem/1 var(--sans);letter-spacing:-.005em;color:var(--accent);margin-bottom:10px}
.foot-in a{display:block;padding:5px 0;text-decoration:none}
.foot-in a:hover{color:var(--on)}
.foot p{max-width:44ch}
.foot p + p{margin-top:8px}
.mega{display:block;margin-top:clamp(18px,3vw,36px);font:700 clamp(2.6rem,12.6vw,11.6rem)/.9 var(--sans);letter-spacing:-.06em;text-decoration:none;white-space:nowrap;text-align:center;
  background:radial-gradient(circle,var(--glow) 1.5px,transparent 2.1px) 0 0/5px 5px;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;transition:filter .3s}
.mega:hover{filter:brightness(1.2) drop-shadow(0 0 18px color-mix(in srgb,var(--glow) 55%,transparent))}

/* phone dock */
.dock{display:none}

.nf{min-height:54vh;display:flex;flex-direction:column;justify-content:center;gap:18px;align-items:flex-start}
.nf h1{font:var(--t-display);letter-spacing:-.045em}

/* ---------- smaller screens ---------- */
@media (max-width:1180px){.top .soc{display:none}}
@media (max-width:1000px){
  .nav{display:none}
  .menu-btn{display:inline-flex;align-items:center}
  .tabs{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;border-top:0;margin-inline:calc(var(--pad) * -1);padding:2px var(--pad) 10px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button,.tabs button + button{flex:none;width:168px;padding:11px 14px 12px;border:1px solid var(--rule-2);border-radius:14px;margin:0;scroll-snap-align:start}
  .tabs button[aria-selected="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
  .skills li{grid-template-columns:minmax(0,1fr) auto}
  .skills p{grid-column:1/-1;grid-row:2}
}
@media (max-width:900px){
  .hero-in{grid-template-columns:minmax(0,1fr);gap:28px}
  .svc{grid-template-columns:repeat(2,minmax(0,1fr))}
  .svc li:not(:nth-child(3n+1)){padding-left:0;border-left:0}
  .svc li:not(:nth-child(3n+1))::before{display:none}
  .svc li:nth-child(even){padding-left:22px;border-left:1px solid var(--rule)}
  .faq-in{grid-template-columns:minmax(0,1fr)}
  .sec-head{grid-template-columns:minmax(0,1fr)}
  .case,.builder-in,.where,.month,.pull,.me,.me.solo,.feature,.reach,.reels,.reel-head{grid-template-columns:minmax(0,1fr)}
  .case{grid-template-areas:"fig" "body" "ver"}
  .case-body{padding:0 4px}
  .verdict{grid-template-columns:minmax(0,1fr);padding:14px 4px 6px}
  .kit{max-width:240px}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:18px}
  .steps li:nth-child(3){padding-left:0;border-left:0}
  .steps li:nth-child(3)::before{display:none}
  .steps li:nth-child(n+3){border-top:1px solid var(--rule)}
  .words{grid-template-columns:minmax(0,1fr)}
  .pdc3{grid-template-columns:minmax(0,1fr)}
  .pdc3 > div + div{border-left:0;border-top:1px solid var(--rule)}
  .figs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .figs div:nth-child(3){padding-left:0;border-left:0}
  .figs div:nth-child(n+3){border-top:1px solid var(--rule)}
  .foot-in{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  body{font-size:1rem}
  .top-call span{display:none}
  .pill.top-call{padding:0;min-height:44px;gap:0;background:none}
  .top-call .arr{width:44px;height:44px}
  .top-call .arr svg{width:18px;height:18px}
  .svc{grid-template-columns:minmax(0,1fr)}
  .svc li:nth-child(even){padding-left:0;border-left:0}
  .stage-gl,.pano{aspect-ratio:1/.86}
  .ticket{grid-area:2/1;align-self:auto;justify-self:stretch;width:auto;margin:10px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,auto);justify-content:space-between;gap:0 12px;background:none;box-shadow:none;border-radius:0;transform:none}
  .ticket b{display:none}
  .ticket div{display:block;padding:0;border-top:0}
  .ticket dd{text-align:left;font-weight:600}
  .stage-foot{grid-area:3/1}
  .scrub{width:100%}
  .scrub input{flex:1;width:auto}
  .case-fig .shot img{aspect-ratio:4/3}
  .did,.give,.locs{grid-template-columns:minmax(0,1fr)}
  .steps{grid-template-columns:minmax(0,1fr)}
  .steps li + li{padding-left:0;border-left:0;border-top:1px solid var(--rule)}
  .steps li + li::before{display:none}
  .form .two{grid-template-columns:minmax(0,1fr)}
  .rule-note{grid-template-columns:minmax(0,1fr)}
  .forwho{grid-column:1}
  .route li{grid-template-columns:minmax(0,1fr)}
  .reach-row{grid-template-columns:minmax(0,1fr)}
  .tact{margin-inline:10px;padding-right:20px}
  .dock{display:grid;grid-template-columns:1.3fr 1fr 1fr;position:fixed;left:0;right:0;bottom:0;z-index:45;background:color-mix(in srgb,var(--page-lo) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--rule-2);padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));gap:8px}
  .dock a{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:999px;border:1px solid var(--rule-2);color:var(--on);font:500 1rem/1 var(--sans);text-decoration:none}
  .dock a.hot{background:var(--btn) var(--grain);color:var(--btn-on);border-color:transparent}
  .dock svg{width:17px;height:17px}
  .foot{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  .wall.sheets{columns:1}
  .map .t-b{font-size:31px}
  .map .t-r,.map .t-m{display:none}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
}
@media (min-width:1001px){.sheetnav{display:none!important}}
::view-transition-old(root),::view-transition-new(root){animation-duration:.22s}
@media (prefers-reduced-motion:reduce){::view-transition-old(root),::view-transition-new(root){animation:none}}

/* ================= short home: one point per screen, big type ================= */
.hero2{background:radial-gradient(60% 80% at 88% 8%,var(--hero-glow),transparent 62%)}
.hero2 .wrap{padding-block:clamp(56px,11vw,150px) clamp(48px,8vw,110px)}
.hero2 h1{font:650 clamp(2.9rem,8.2vw,6.6rem)/.96 var(--sans);letter-spacing:-.05em;max-width:13ch;text-wrap:balance}
.hero2-lede{font:400 clamp(1.3rem,2.2vw,1.75rem)/1.35 var(--sans);letter-spacing:-.015em;color:var(--on-2);margin-top:clamp(18px,2.4vw,30px);max-width:30ch}
.hero2 .hero-acts{margin-top:clamp(28px,3.4vw,44px);gap:12px}
.pill.big{min-height:62px;font-size:1.2rem;padding-left:28px}
.pill.big .arr{width:50px;height:50px}
.hero2-note{margin-top:20px;font:500 1.15rem/1.4 var(--sans);color:var(--accent)}
.sec2{padding-block:clamp(52px,7vw,100px);border-top:1px solid var(--rule)}
.h2b{font:650 clamp(2.2rem,5.2vw,4.2rem)/1 var(--sans);letter-spacing:-.045em;max-width:18ch;text-wrap:balance}
.lede2{font:400 clamp(1.2rem,1.8vw,1.45rem)/1.4 var(--sans);color:var(--on-2);margin-top:14px}
/* before / after */
.ba{margin-top:clamp(28px,4vw,48px);--t:0}
.ba-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center;font:650 clamp(1.25rem,2vw,1.6rem)/1 var(--sans);letter-spacing:-.03em;padding:18px 0 26px;border-bottom:1px solid var(--rule-2)}
.ba-head span:first-child{color:var(--band)}
.ba-head span:last-child{color:var(--accent)}
.ba-head input{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;cursor:ew-resize;margin:0}
.ba-head input::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--band),var(--accent))}
.ba-head input::-moz-range-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--band),var(--accent))}
.ba-head input::-webkit-slider-thumb{-webkit-appearance:none;width:40px;height:40px;margin-top:-17px;border-radius:50%;background:var(--on);border:8px solid var(--page);box-shadow:0 0 0 2px var(--accent)}
.ba-head input::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--on);border:8px solid var(--page);box-shadow:0 0 0 2px var(--accent)}
.ba-rows li{border-bottom:1px solid var(--rule)}
.ba-rows a{display:grid;grid-template-columns:minmax(0,15rem) minmax(0,1fr) minmax(0,12rem);gap:10px 28px;align-items:center;padding:22px 0;text-decoration:none}

.sp-pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 0}
.sp-lead .sp-fig{flex:1 1 auto}
.sp-lead .sp-pic{flex:1 1 auto;aspect-ratio:auto;min-height:200px}
.sp-t{display:block;margin-top:9px;font:650 1.0625rem/1.25 var(--sans);letter-spacing:-.02em;color:var(--on)}
.sp-d{display:block;margin-top:3px;font:400 1rem/1.4 var(--sans);color:var(--on-2);text-wrap:pretty}
.sp-d .d-s{display:none}
a.sp:focus-visible .sp-fig{box-shadow:0 0 0 3px var(--glow),0 22px 44px -30px rgba(0,0,0,.8)}
@media (hover:hover){a.sp:hover .sp-fig{box-shadow:0 0 0 3px var(--glow),0 22px 44px -30px rgba(0,0,0,.8)}a.sp:hover .sp-fig.sp-chart{box-shadow:none}a.sp:hover .sp-chart .sp-pic{border-color:var(--glow)}}
a.sp:focus-visible{outline:none}
.sp .bz-url{padding:6px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp .bz-url::before{width:8px;height:8px;box-shadow:13px 0 0 #FFB23E,26px 0 0 #6B4A72;margin-right:36px}
/* on the home tiles the address sits on the picture, so the small tiles stay short */
.deck .sp:not(.sp-lead) .sp-fig{position:relative}
.deck .sp:not(.sp-lead) .bz-url{position:absolute;left:8px;bottom:8px;z-index:1;max-width:calc(100% - 16px);padding:4px 10px;border-radius:999px;background:rgba(30,12,40,.88);color:var(--veil-on);font:500 1rem/1.2 var(--sans)}
.deck .sp:not(.sp-lead) .bz-url::before{display:none}
/* a result with numbers is a small chart in the same frame as the pictures: before in red, now in amber, to scale */
.sp-fig.sp-chart{background:none;box-shadow:none}
.sp-chart .sp-pic{display:flex;flex-direction:column;justify-content:center;padding:10px 16px;border:1px solid var(--rule-2);border-radius:var(--r-sm);background:none}
a.sp:focus-visible .sp-fig.sp-chart{box-shadow:none}
a.sp:focus-visible .sp-chart .sp-pic{border-color:var(--glow)}
.bars{display:grid;gap:10px}
.bar{display:block}
.bar-l{display:flex;justify-content:space-between;gap:10px;font:400 1rem/1.2 var(--sans);color:var(--on-2);white-space:nowrap}
.bar-l b{font-weight:650;color:var(--on)}
.bar-t{display:block;height:10px;margin-top:5px;border-radius:5px;background:rgba(247,235,245,.13);overflow:hidden}
.bar-t i{display:block;height:100%;border-radius:5px;background:var(--band)}
.bar.new .bar-t i{background:var(--glow)}
.stack{display:flex;gap:3px;height:40px}
.stack i{display:flex;align-items:center;justify-content:center;min-width:24px;border-radius:5px;font:650 1rem/1 var(--sans);font-style:normal;white-space:nowrap;color:#2B1437;background:var(--glow)}
.stack i span{margin-left:.3em}
.stack i:nth-child(2){background:#FFC978}
.stack i:nth-child(3){background:#FFDFAE}
.stack i:nth-child(4){background:#F7EBF5}
.sp-names{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 14px;width:100%}
.sp-names i{font:650 clamp(1rem,1.3vw,1.15rem)/1.25 var(--sans);font-style:normal;letter-spacing:-.02em;color:var(--on)}
/* the phone app: its screens stand upright */
.subs.n3{grid-template-columns:minmax(0,1.55fr) repeat(3,minmax(0,1fr))}
.subs.n3 .sp-lead{grid-row:auto}
.subs.n3 .sp:not(.sp-lead) .sp-pic{aspect-ratio:3/3.9}
/* on a business page: every sub-project, the main one across two columns */
.subs.all{grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(22px,2.6vw,36px) clamp(16px,2vw,28px);margin-top:0}
.subs.all .sp-lead{grid-column:span 2}
.subs.all .sp-pic{aspect-ratio:16/9}
.subs.all .sp-lead .sp-pic{aspect-ratio:auto}
.subs.all.wide .sp-lead{grid-row:auto}
.subs.all.wide .sp-lead .sp-pic{aspect-ratio:2.4/1;flex:none}
.subs.all .sp-t{font-size:1.2rem}
.subs.all .sp-d{max-width:34em}
.subs.all .sp-chart .sp-pic{padding:16px 22px}
.subs.all + .did{margin-top:clamp(26px,3.4vw,44px)}
.did li{scroll-margin-top:16px}
.sp:target .sp-fig:not(.sp-chart){box-shadow:0 0 0 3px var(--glow)}
.sp:target .sp-chart .sp-pic{border-color:var(--glow)}
.did li:target b{color:var(--glow)}

/* ABOUT: fewer sections, plain ones */
.edge{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(22px,3vw,40px) clamp(24px,3.4vw,52px)}
.edge h3{font:650 1.2rem/1.2 var(--sans);letter-spacing:-.025em;color:var(--glow)}
.edge p{margin-top:8px;font:400 1.0625rem/1.45 var(--sans);color:var(--on);text-wrap:pretty}
.me-kit{margin-top:22px;max-width:340px}
.me-kit figcaption{font-size:1rem}
.word figcaption a{font:500 1rem/1.3 var(--sans);color:var(--on-2);text-decoration:none}
.view[data-view=about] .fold{grid-column:1/-1}

/* BUSINESS PAGES: the story in plain type, then the sub-projects */
.phead .meta{max-width:62em;font:400 1.0625rem/1.5 var(--sans);color:var(--on)}
.cta:not(.paper){padding-inline:0;border-top:1px solid var(--rule-2);border-radius:0}
/* FOOTER: one quiet line on every page. The phone number is in the header. */
main:has(> .view[data-view=home].on) ~ .foot{display:block}
.foot{padding-block:16px calc(16px + env(safe-area-inset-bottom,0px))}
.foot-row{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 36px;font-size:1rem;color:var(--on-2)}
.foot-row p{max-width:none;margin:0}
.foot-row b{display:inline;margin:0 8px 0 0;font:600 1rem/1.3 var(--sans);color:var(--accent)}
.foot-row nav{display:flex;flex-wrap:wrap;gap:4px 20px}
.foot-row nav a{text-decoration:none}
.foot-row nav a:hover{color:var(--on)}

@media (max-width:900px){
  .subs,.subs.all{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sp-lead,.subs.all .sp-lead{grid-column:1/-1;grid-row:auto}
  .sp-lead .sp-pic,.subs.all .sp-lead .sp-pic{aspect-ratio:2/1;min-height:0;flex:none}
  .subs.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .edge{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .hero4-soc .chip.dk{display:none}
  .hero4-cta{grid-auto-flow:column;justify-content:space-between;align-items:center}
  .btabs-sub{display:none}
  .deck .bz-subs h3{font-size:1.2rem}
  .deck .bz-subs h3 small{display:none}
  .bz .bz-text > p.bz-lede{font-size:1rem;line-height:1.4;margin-top:4px}
  .bz-lede .d-l{display:none}
  .bz-lede .d-s{display:inline}
  main:has(> .view[data-view=home].on) ~ .foot{display:none}
  .deck .bz-subs .pill{display:none}
  .deck .subs{gap:12px 10px;margin-top:10px}
  .deck .sp-lead .sp-pic{aspect-ratio:21/9}
  .deck .sp:not(.sp-lead) .sp-pic{aspect-ratio:16/8}
  .deck .subs.n3 .sp:not(.sp-lead) .sp-pic{aspect-ratio:3/4}
  .deck .sp:not(.sp-lead) .sp-d{display:none}
  .deck .sp-t{margin-top:7px;font-size:1rem}
  .sp-d .d-l{display:none}
  .sp-d .d-s{display:inline}
  .deck .sp:not(.sp-lead) .bz-url{left:5px;bottom:5px;padding:3px 8px;max-width:calc(100% - 10px)}
  .deck .bz-subs h3{padding-right:0}
  .deck .sp-lead .bz-url{padding:5px 10px}
  .deck .sp-chart .sp-pic{padding:6px 10px}
  .deck .bars{gap:5px}
  .deck .bar-t{height:7px;margin-top:3px}
  .deck .stack{height:34px}
  .deck .stack i span{display:none}
  .deck .sp-names{display:block;font:650 1rem/1.3 var(--sans);color:var(--on)}
  .deck .sp-names i{display:inline;font-size:1rem;line-height:1.3}
  .deck .sp-names i:not(:last-child)::after{content:", "}
  .subs.all{grid-template-columns:minmax(0,1fr)}
  .edge{grid-template-columns:minmax(0,1fr)}
  .foot-row{justify-content:flex-start}
}

/* WHO: the person behind the page, under the headline */
.hero4-who{display:flex;align-items:center;gap:12px;margin-top:10px;font:400 clamp(1.05rem,1.3vw,1.18rem)/1.3 var(--sans);color:var(--on-2)}
.hero4-who img{flex:none;width:42px;height:42px;border-radius:50%;object-fit:cover;object-position:50% 20%;background:#fff}
.hero4-who b{margin-right:10px;font-weight:650;color:var(--on)}
.hero4-who .who-s{display:none}
/* quiet type: no coloured words. Colour is for links in use and for charts. */
.hero4 .hero2-note{color:var(--on-2)}
.btab small{font-weight:650;color:var(--veil-on)}
.btab b{font-weight:400;color:rgba(247,235,245,.86)}
.btabs-sub{font-weight:500;color:var(--on)}
.edge h3{color:var(--on)}
.phead .note b{color:inherit;font-weight:inherit}
/* WITH AI, TEACHING, FEEDBACK: short pages of their own */
.sec.vtop{padding-block:clamp(26px,3.6vw,52px) clamp(30px,4vw,56px)}
.vh{font:650 clamp(1.9rem,3.1vw,2.6rem)/1.06 var(--sans);letter-spacing:-.04em;max-width:28ch;text-wrap:balance}
.vlede{margin-top:10px;max-width:60em}
.vh + .edge,.vlede + .edge,.vlede + .steps,.vh + .words{margin-top:clamp(20px,2.6vw,34px)}
.vsub{margin:clamp(30px,4vw,52px) 0 clamp(14px,1.8vw,22px);font:650 clamp(1.3rem,2vw,1.7rem)/1.15 var(--sans);letter-spacing:-.03em}
.month2{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:18px;max-width:34rem}
.month2 span{display:flex;align-items:center;justify-content:center;min-height:54px;border:1px solid var(--rule-2);border-radius:10px;font:600 1rem/1.2 var(--sans);text-align:center}
.month2 .shop{border-color:transparent;background:var(--glow);color:#2B1437}
.plain-note{margin-top:14px;max-width:34rem;font:400 1.0625rem/1.45 var(--sans);color:var(--on)}
.chart-cap{display:block;margin-top:8px;font:400 1rem/1.2 var(--sans);color:var(--on-2)}
.shopbox:not(.paper){padding:0}
@media (max-width:640px){
  .top .top-call{display:none}
  .hero4-who{font-size:1rem;gap:10px;margin-top:8px}
  .hero4-who img{width:42px;height:42px}
  .hero4-who b{display:block;margin:0}
  .hero4-who .who-l{display:none}
  .hero4-who .who-s{display:inline}
  .deck .chart-cap{display:none}
}

.steps time{color:var(--on-2)}
.foot-row b{color:var(--on)}
.view[data-view=teaching] .rule-note{background:none;border:0;border-top:1px solid var(--rule-2);border-radius:0;padding:16px 0 0}
.view[data-view=teaching] .rule-note .note{color:var(--on-2)}

/* ABOUT: the long sections fold under their headings, so the page is a short list, not a long scroll */
.folded{padding-block:0 !important}
.fold > summary{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 0;border-top:1px solid var(--rule-2);font:600 clamp(1.25rem,2vw,1.6rem)/1.2 var(--sans);letter-spacing:-.025em;cursor:pointer;list-style:none}
.fold > summary::-webkit-details-marker{display:none}
.fold > summary::after{content:"+";flex:none;font:400 1.7rem/1 var(--sans);color:var(--accent)}
.fold[open] > summary::after{content:"\2013"}
.fold > summary:focus-visible{outline:2px solid var(--glow);outline-offset:4px}
.fold[open] > .fold-body{padding-bottom:clamp(28px,4vw,56px)}

/* five projects on one timeline */
.lanes{margin-top:clamp(28px,4vw,48px)}
.ln-axis,.lanes li a{display:grid;grid-template-columns:minmax(0,17rem) minmax(0,1fr);gap:8px 28px;align-items:center}
.ln-months{position:relative;height:54px;border-bottom:1px solid var(--rule-2)}
.ln-months span{position:absolute;bottom:10px;font:600 1rem/1 var(--sans);color:var(--on-2);padding-left:8px;border-left:1px solid var(--rule-2);height:22px;display:flex;align-items:flex-end}
.ln-five{position:absolute;top:0;height:20px;border-radius:999px;background:var(--accent);color:var(--btn-on);font:700 .9rem/20px var(--sans);text-align:center;white-space:nowrap;min-width:68px}
.ln-now{position:absolute;left:var(--now);bottom:-6px;transform:translateX(-50%);font:700 .9rem/1 var(--sans);color:var(--accent);display:none}
.lanes ol{position:relative}
.lanes li{border-bottom:1px solid var(--rule)}
.lanes li a{padding:18px 0;text-decoration:none}
.ln-name b{display:block;font:650 clamp(1.15rem,1.6vw,1.4rem)/1.15 var(--sans);letter-spacing:-.03em}
.ln-name small{display:block;font:400 1rem/1.3 var(--sans);color:var(--on-2);margin-top:4px}
.ln-res{display:none}
.ln-track{position:relative;height:46px;background:linear-gradient(90deg,var(--rule) 1px,transparent 1px) 0 0/25% 100%}
.ln-track i{position:absolute;top:0;bottom:0;border-radius:12px;background:var(--card);color:var(--card-on);display:flex;align-items:center;overflow:hidden;min-width:8px}
.ln-track em{font:650 clamp(.95rem,1.2vw,1.1rem)/1 var(--sans);font-style:normal;letter-spacing:-.02em;padding:0 14px;white-space:nowrap}
.lanes li a:hover .ln-track i{background:var(--accent)}
.lanes li a:hover .ln-name b{text-decoration:underline;text-underline-offset:.2em;text-decoration-thickness:1px}
@media (max-width:900px){
  .ln-axis,.lanes li a{grid-template-columns:minmax(0,1fr)}
  .ln-gap{display:none}
  .ln-track{height:22px}
  .ln-track em{display:none}
  .ln-res{display:block;margin-top:6px;font:600 1.05rem/1.2 var(--sans);color:var(--accent)}
  .ln-name small{display:none}
  .lanes li a{padding:14px 0;gap:8px}
}


/* ================================================================ v15 (11/24, late evening)
   Tablet, landscape and phone layout; the place kept by Back and the menu; a dark photo viewer; the measure of the text. */

/* skip link, and no outline on a heading that only received the focus after a page change */
.skip{position:absolute;left:12px;top:-64px;z-index:100;display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:999px;background:var(--btn);color:var(--btn-on);font:600 1rem/1 var(--sans);text-decoration:none}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + 10px)}
h1[tabindex="-1"]:focus,main[tabindex="-1"]:focus{outline:0}
html.locked{overflow:hidden}
.sheetnav{overscroll-behavior:contain;max-height:100vh;max-height:100dvh}

/* FOUR businesses: four tabs across */
.btabs{grid-template-columns:repeat(4,minmax(0,1fr))}
.btab{aspect-ratio:2/1}
@media (max-height:780px) and (min-width:901px){.btab{aspect-ratio:5/2}}

/* the story of a business: two short paragraphs side by side on a wide screen, so no line runs past eighty characters */
.bz-lede .d-l > span{display:inline}
@media (min-width:901px){
  .bz-lede .d-l.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 clamp(28px,3.4vw,48px)}
  .bz-lede .d-l.two > span{display:block}
}
/* the story as one plain statement and a quieter line of context under it */
@media (min-width:641px){
  .bz-lede .d-l.cc{display:grid;gap:3px}
  .bz-lede .cc-claim{display:block;font:400 1.35rem/1.25 var(--sans);letter-spacing:-.02em;color:var(--on);text-wrap:balance}
  .bz-lede .cc-ctx{display:block;font:400 1rem/1.4 var(--sans);letter-spacing:-.006em;color:var(--on-2);max-width:none}
  /* the story as two rows: what it was, what it is */
  .bz-lede .d-l.bn{display:grid;gap:2px}
  .bz-lede .bn-r{display:grid;grid-template-columns:4rem minmax(0,1fr);gap:0 14px;align-items:baseline}
  .bz-lede .bn-r i{font-style:normal;font-size:1rem;color:var(--on-2)}
  .bz-lede .bn-r > span{display:block}
}

/* HERO: one column up to 900 px wide and on a phone held sideways */
@media (max-width:900px), (orientation:landscape) and (max-height:500px){
  .hero4-in{grid-template-columns:minmax(0,1fr);gap:12px;align-items:start}
  .hero4 h1{max-width:22ch}
  .hero4-cta{justify-items:start;gap:8px}
  .hero4-soc{justify-content:flex-start;max-width:none}
}
/* a phone held sideways: the header scrolls away, and the call button sits in it */
@media (orientation:landscape) and (max-height:500px){
  .top{position:static}
  .dock{display:none}
  .top .top-call{display:inline-flex}
  .foot{padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
}

/* the bar at the bottom of a phone: three equal buttons, nothing clipped, and the page ends above it */
@media (max-width:640px){
  .dock{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .dock a{gap:6px;min-width:0;padding-inline:4px;font-size:.95rem;white-space:nowrap}
  .dock svg{width:18px;height:18px;flex:none}
  .foot{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  main:has(> .view[data-view=home].on){padding-bottom:calc(66px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:340px){.dock a{font-size:.875rem;gap:4px} .dock svg{width:16px;height:16px}}
body.typing .dock{display:none}

/* a finger needs 44 px */
@media (pointer:coarse){
  .brand{min-height:44px}
  .nav a{min-height:44px;display:inline-flex;align-items:center}
  .soc a{width:44px;height:44px}
  .chip,.filters button{min-height:44px}
  .foot-row nav{gap:0 18px}
  .foot-row nav a{display:inline-flex;align-items:center;min-height:44px}
}
@media (pointer:coarse) and (min-width:641px){.btabs-sub{display:inline-flex;align-items:center;min-height:44px}}
a,button,summary,label{touch-action:manipulation}

/* PHOTO VIEWER: dark like the page, zoom by double tap or the + button */
dialog.lb{background:var(--page-lo);color:var(--on);border:1px solid var(--rule);max-height:94vh;max-height:94dvh;box-shadow:0 40px 90px -30px rgba(0,0,0,.8)}
.lb-stage{display:flex;overflow:hidden;background:var(--page-lo);max-width:min(1500px,96vw)}
.lb-stage img{flex:none;margin:auto}
.lb img{max-height:calc(94vh - 62px);max-height:calc(94dvh - 62px);touch-action:manipulation;cursor:zoom-in;transition:opacity .2s}
.lb.wait img{opacity:.3}
.lb-stage.zoomed{overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.lb-stage.zoomed img{max-width:none;max-height:none;cursor:zoom-out;touch-action:pan-x pan-y pinch-zoom}
.lbbar{padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.lbbar span{color:var(--on-2)}
.lbbar button{border-color:var(--rule-2);color:var(--on)}
.lbbar button:hover{border-color:var(--on)}
#lb-zoom{font-size:1.2rem;padding-inline:0}
@media (prefers-reduced-motion:reduce){.lb img{transition:none}}

/* ---------------------------------------------------------------- the look: one scale of type, even gaps, clean pictures */
/* type: 16 / 17 / 18.4 / 21.6 and the headline. No in-between sizes. */
.hero4-who{font-size:1.0625rem;gap:12px}
.hero4-who img{width:46px;height:46px}
.hero4-who b{display:block;margin:0;font-weight:650;letter-spacing:-.015em}
.hero4-who .who-l,.hero4-who .who-s{font-size:1rem}
.btabs-h{font-size:1.15rem}
.btab b{font-size:1rem}
.btab small{font-size:1.0625rem;letter-spacing:-.015em}
/* pictures: one frame for every tile, nothing laid over a screenshot */
.sp-fig{border-radius:12px;box-shadow:0 0 0 1px rgba(247,235,245,.1),0 24px 48px -32px rgba(0,0,0,.85)}
.sp:hover .sp-fig,.sp:focus-visible .sp-fig{box-shadow:0 0 0 1px rgba(247,235,245,.1),0 24px 48px -32px rgba(0,0,0,.85)}
@media (hover:hover){.sp:hover .sp-fig{box-shadow:0 0 0 2px var(--glow),0 24px 48px -32px rgba(0,0,0,.85)}}
.sp:focus-visible .sp-fig{box-shadow:0 0 0 2px var(--glow),0 24px 48px -32px rgba(0,0,0,.85)}
.sp-t{margin-top:10px;letter-spacing:-.015em}
/* tabs: a quieter veil under the words, a thinner ring on the one that is open */
.btab{border-radius:12px}
.btab > span{padding:30px 14px 11px;background:linear-gradient(180deg,rgba(var(--veil),0),rgba(var(--veil),.82) 60%,rgba(var(--veil),.94))}
.btab.on{box-shadow:0 0 0 2px var(--glow)}
/* the head of a business: its name and the button on one line, the story under them */
@media (min-width:641px){
  .deck .bz-subs h3{display:flex;align-items:baseline;flex-wrap:wrap;gap:0 4px;min-height:40px;padding:8px 190px 0 0}

/* ---------------------------------------------------------------- every page on one scale: 14.4 / 16 / 17 / 19.2 / 21.6 / 28 / page title */
:root{--t-h2:650 1.75rem/1.12 var(--sans);--t-h3:650 1.2rem/1.22 var(--sans);--t-lede:400 1.2rem/1.5 var(--sans);--t-title:650 clamp(2.1rem,3.5vw,2.9rem)/1.04 var(--sans)}
.phead h1,.vh,.reach h2{font:var(--t-title);letter-spacing:-.04em;max-width:22ch}
.vsub{font:var(--t-h2);letter-spacing:-.035em}
.sub-h,.h2{letter-spacing:-.035em}
.fold > summary{font:650 1.35rem/1.2 var(--sans)}
.me-text p{font:400 1.0625rem/1.55 var(--sans);letter-spacing:-.006em;max-width:54ch}
.phead .meta{font:var(--t-lede);letter-spacing:-.01em;max-width:52ch}
.vlede{max-width:52ch}
.word blockquote,.sec2 .word blockquote{font-size:1.0625rem}
@media (max-width:900px){:root{--t-h2:650 1.5rem/1.14 var(--sans);--t-lede:400 1.0625rem/1.5 var(--sans)}}
/* a title is followed by its page, not by a gap */
.view[data-view=about] .phead{padding-bottom:clamp(14px,2vw,24px)}
.view[data-view=about] .phead + .sec{padding-top:clamp(8px,1.4vw,18px)}

@media (min-width:901px){

}
/* forms: dark fields with a fine line, like the rest of the page */
.form input[type=text],.form input[type=tel],.form input[type=email],.form textarea{background:rgba(18,5,24,.42);border-color:var(--rule-2);color:var(--on);font-size:1rem;min-height:50px}
.form input[type=text]:hover,.form textarea:hover{border-color:rgba(247,235,245,.7)}
.shopbox{border:1px solid var(--rule);background:rgba(18,5,24,.22)}

.band{padding-block:clamp(40px,5vw,72px)}
.reach{align-items:start}
/* touch: the remaining small targets */
@media (pointer:coarse){

/* ABOUT: the text starts under its title; the contact band is two even columns */
#me-sec .sec-head{display:none}

@media (min-width:901px){
  .reach{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto 1fr;gap:clamp(18px,2.4vw,30px) clamp(24px,4.6vw,72px)}

.nf h1{font:var(--t-title);letter-spacing:-.04em}
/* the photo viewer on a phone: the caption on its own line, four even buttons under it */
@media (max-width:640px){
  .lbbar{flex-wrap:wrap;gap:8px;padding-top:10px}
  .lbbar span{flex:1 1 100%;padding-inline:2px;font-size:1rem;line-height:1.35}
