<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
@font-face{font-family:"Geist";font-weight:100 900;src:url(/assets/fonts/geist-latin-wght-normal.woff2) format("woff2")}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}
body{background:radial-gradient(70% 90% at 92% 4%,rgba(255,80,130,.24),transparent 62%),#2B1437 url(/assets/img/grain.png);color:#F7EBF5;font-family:"Geist",sans-serif;overflow:hidden;position:relative}
/* ---- link preview and cover: the first screen of the site. The name, the photo, the headline, the four businesses. ---- */
.og{position:absolute;inset:0;padding:56px 64px 92px;display:grid;grid-template-columns:1.06fr .94fr;gap:52px;align-items:center}
.who{display:flex;align-items:center;gap:16px;font:650 27px/1.1 "Geist";letter-spacing:-.025em}
.who img{width:64px;height:64px;border-radius:50%;object-fit:cover;object-position:50% 20%;background:#fff}
.og h1{font:650 61px/1.02 "Geist";letter-spacing:-.045em;margin-top:34px}
.og h1 span{display:block;white-space:nowrap}
.og p.l{font:400 24px/1.42 "Geist";color:#CBAFD1;margin-top:22px;letter-spacing:-.01em;max-width:19.5em}
.work{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.work figure{position:relative;aspect-ratio:5/4;border-radius:16px;overflow:hidden;background:#1E0C28;box-shadow:0 0 0 1px rgba(247,235,245,.12),0 30px 60px -34px rgba(0,0,0,.9)}
.work img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.work figcaption{position:absolute;left:0;right:0;bottom:0;padding:34px 16px 13px;background:linear-gradient(180deg,rgba(20,8,26,0),rgba(20,8,26,.84) 62%,rgba(20,8,26,.95));font:650 21px/1.15 "Geist";letter-spacing:-.02em}
.og .ft{position:absolute;left:64px;right:64px;bottom:38px;display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid rgba(247,235,245,.2);padding-top:16px;font:500 21px/1 "Geist";color:#CBAFD1;letter-spacing:-.01em}
.og .ft b{font:600 21px/1 "Geist";color:#F7EBF5;letter-spacing:-.015em}
body.cover .og{padding:84px 100px 132px;gap:72px}
body.cover .who{font-size:36px;gap:22px}body.cover .who img{width:86px;height:86px}
body.cover .og h1{font-size:82px;margin-top:44px}
body.cover .og p.l{font-size:32px;margin-top:30px}
body.cover .work{gap:20px}body.cover .work figure{border-radius:22px}
body.cover .work figcaption{font-size:28px;padding:46px 22px 18px}
body.cover .og .ft{left:100px;right:100px;bottom:54px;font-size:27px;padding-top:22px}
body.cover .og .ft b{font-size:27px}
/* ---- avatar ---- */
.av{position:absolute;inset:0;display:grid;place-items:center}
.av svg{width:58%;height:58%}
</style></head><body>
<script>
const q = new URLSearchParams(location.search), k = q.get('k');
const mark = '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="6.2" stroke="#FFB23E"/><path d="M12 1.5v21M1.5 12h21" stroke="#F7EBF5"/></svg>';
if (k === 'avatar') {
  document.body.innerHTML = '<div class="av">' + mark.replace('stroke-width="1.5"', 'stroke-width="1.15"') + '</div>';
} else {
  if (k === 'cover') document.body.className = 'cover';
  const tile = (img, name) => '<figure><img src="/assets/img/' + img + '.webp" alt=""><figcaption>' + name + '</figcaption></figure>';
  document.body.innerHTML = '<div class="og"><div><p class="who"><img src="/assets/img/rustam-shabanov.webp" alt="">Rustam Shabanov</p>'
    + '<h1><span>Hands-on AI help</span><span>for small businesses</span><span>in New York.</span></h1>'
    + '<p class="l">On site and in person. Built with the team, so the team runs it after.</p></div>'
    + '<div class="work">' + tile('pl-k_09', 'Kitchen showroom') + tile('cab-inside', 'Elevator cab maker') + tile('sf-nj', 'Game venues') + tile('lb-projects', 'Builder') + '</div>'
    + '<div class="ft"><b>mycv4u.com</b><span>Brooklyn, New York</span></div></div>';
}
</script>
</body></html>
